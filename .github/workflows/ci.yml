name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test MarkdownCore
        run: |
          cd Packages/MarkdownCore
          swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app and Quick Look extension (ad-hoc signed)
        run: |
          xcodebuild -project MarkdownViewer.xcodeproj \
            -scheme MarkdownViewer \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build

      - name: Package app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent MarkdownViewer.app "$GITHUB_WORKSPACE/MarkdownViewer.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer
          path: MarkdownViewer.zip
