name: MarkdownViewer
options:
  bundleIdPrefix: com.tbshill
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MarkdownCore:
    path: Packages/MarkdownCore

targets:
  MarkdownViewer:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: MarkdownViewer
        excludes:
          - Info.plist
          - MarkdownViewer.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tbshill.MarkdownViewer
        PRODUCT_NAME: MarkdownViewer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: MarkdownQuickLook
        embed: true
        codeSign: true
      - package: MarkdownCore
    info:
      path: MarkdownViewer/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: Markdown Viewer
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright 2025 tbshill. All rights reserved."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkd
                - mkdn
                - mdwn
              public.mime-type:
                - text/markdown
    entitlements:
      path: MarkdownViewer/MarkdownViewer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true

  MarkdownQuickLook:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: MarkdownQuickLook
        excludes:
          - Info.plist
          - MarkdownQuickLook.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tbshill.MarkdownViewer.QuickLook
        PRODUCT_NAME: MarkdownQuickLook
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: MarkdownCore
    info:
      path: MarkdownQuickLook/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: Markdown Quick Look
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
              - public.markdown
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    entitlements:
      path: MarkdownQuickLook/MarkdownQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true

schemes:
  MarkdownViewer:
    build:
      targets:
        MarkdownViewer: all
        MarkdownQuickLook: all
    run:
      config: Debug
    test:
      config: Debug
